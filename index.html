<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Devotion Notebook</title>
<meta name="theme-color" content="#CDECD5">
<meta name="description" content="A cozy notebook for daily devotions">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devotions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Layout: a soft pastel garden page. Crayon-brown outlines, a lace edge at the top, rounded wobbly cards,
     bottom tab bar on phones and a left rail on wide screens. Clovers mark finished days. */
  --bg:#DDF0F0;
  --bg-all:radial-gradient(circle,rgba(255,255,255,.5) 2px,transparent 2.6px) 0 0/22px 22px,linear-gradient(180deg,#D6EBF6 0%,#DCF1F1 45%,#CDEBD2 100%);
  --paper:#FFFEFA; --paper-2:#F3FAF6;
  --ink:#4B3B3D; --ink-2:#6C5C5B; --outline:#6B5655; --rule:#CFE3EC;
  --blue:#2A80BC; --blue-soft:#C4E5F6; --pink:#E0668A; --pink-soft:#FADCE5;
  --green:#2F7D4F; --green-soft:#CDECD5; --on-accent:#FFFFFF; --hl:#F9E48F; --danger:#B83F34;
  --scrim:rgba(46,34,36,.5);
  --serif:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Gaegu','Chalkboard SE','Comic Sans MS',cursive;
  --wob:18px 24px 16px 26px / 24px 16px 26px 18px;
  --wob-s:11px 15px 10px 16px / 15px 10px 16px 11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#112427;
  --bg-all:radial-gradient(circle,rgba(255,255,255,.04) 2px,transparent 2.6px) 0 0/22px 22px,linear-gradient(180deg,#0E1B26 0%,#112427 50%,#12281F 100%);
  --paper:#172A30; --paper-2:#1D343A;
  --ink:#F2E9E0; --ink-2:#B9ACA3; --outline:#C9B8AC; --rule:#2C4852;
  --blue:#8CCBF0; --blue-soft:#24495E; --pink:#F59AB4; --pink-soft:#4B2C38;
  --green:#85D6A0; --green-soft:#264B39; --on-accent:#0D2417; --hl:#5E5522; --danger:#F29C8E;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#112427;
  --bg-all:radial-gradient(circle,rgba(255,255,255,.04) 2px,transparent 2.6px) 0 0/22px 22px,linear-gradient(180deg,#0E1B26 0%,#112427 50%,#12281F 100%);
  --paper:#172A30; --paper-2:#1D343A;
  --ink:#F2E9E0; --ink-2:#B9ACA3; --outline:#C9B8AC; --rule:#2C4852;
  --blue:#8CCBF0; --blue-soft:#24495E; --pink:#F59AB4; --pink-soft:#4B2C38;
  --green:#85D6A0; --green-soft:#264B39; --on-accent:#0D2417; --hl:#5E5522; --danger:#F29C8E;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-all);background-color:var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 var(--serif);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:34px 120px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--blue)}
.muted{color:var(--ink-2)}
.lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* lace edge */
.lace{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:14px;pointer-events:none;
  background:radial-gradient(circle at 12px 5px,var(--blue-soft) 2.2px,transparent 2.8px) 0 0/24px 100% repeat-x,var(--paper);
  -webkit-mask:radial-gradient(circle at 12px 0,#000 11px,transparent 11.6px) 0 0/24px 100% repeat-x;
  mask:radial-gradient(circle at 12px 0,#000 11px,transparent 11.6px) 0 0/24px 100% repeat-x}

.app{max-width:1020px;margin:0 auto;display:grid;gap:16px;position:relative}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;position:relative;padding-block:6px}
.brand{display:flex;align-items:center;gap:8px;font:700 34px/1.1 var(--hand);color:var(--blue);
  -webkit-text-stroke:7px var(--paper);paint-order:stroke fill;letter-spacing:.01em}
.brand svg{width:34px;height:34px;color:var(--green);-webkit-text-stroke:0;flex:none}
.sync{font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1.5px solid var(--outline);border-radius:999px;padding:3px 12px}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink-2)}
.sync[data-s="saved"]::before{background:var(--green)}
.sync[data-s="error"]::before{background:var(--danger)}
.sync[data-s="local"]::before{background:transparent;border:2px solid var(--ink-2)}
.star{position:absolute;width:22px;height:22px;pointer-events:none;stroke-linejoin:round;stroke-width:2;fill:currentColor;stroke:currentColor}
.star.a{color:var(--pink);right:6%;top:-6px;transform:rotate(12deg)}
.star.b{color:var(--blue);right:14%;top:30px;width:14px;height:14px}
.star.c{color:#E9B84A;right:2%;top:26px;width:16px;height:16px;transform:rotate(-14deg)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--paper);border-top:2px solid var(--outline);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;background:none;border:0;border-radius:var(--wob-s);
  color:var(--ink-2);font:700 12px var(--serif);cursor:pointer}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.nav button:hover{background:var(--paper-2)}

.sheet{background:var(--paper);border:2px solid var(--outline);border-radius:var(--wob);padding:20px 18px 24px;min-width:0;display:grid;gap:26px;align-content:start}
.sheet>section,.sheet>div{min-width:0}
h2{font:700 32px/1.15 var(--hand);color:var(--blue);text-wrap:balance}
h3{font:700 24px/1.2 var(--hand);color:var(--ink)}
h4{font-size:15px;font-weight:800}
.sec{display:grid;gap:12px}
.sec>header{display:grid;gap:2px}

.btn{min-height:46px;padding:0 18px;border-radius:var(--wob-s);border:2px solid var(--outline);background:var(--paper);color:var(--ink);font:800 15px var(--serif);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--green);color:var(--on-accent);border-color:var(--outline)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:var(--rule)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px}

input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 30%,transparent)}
textarea{font:17px/32px var(--serif);padding:0 12px 1px;min-height:98px;resize:vertical;background-color:var(--paper-2);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.fld{display:grid;gap:5px;min-width:0}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:110px 1fr}.row2.eq{grid-template-columns:1fr 1fr}}

/* checkboxes */
.chk{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:5px 0;cursor:pointer;border-bottom:1.5px dashed var(--rule)}
.chk input{position:absolute;opacity:0;width:26px;height:26px;left:0;margin:0}
.box{width:28px;height:28px;border:2px solid var(--outline);border-radius:9px 11px 8px 12px/11px 8px 12px 9px;flex:none;display:grid;place-items:center;background:var(--paper-2)}
.box::after{content:"";width:7px;height:13px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.chk input:checked+.box{background:var(--green)}
.chk input:checked+.box::after{opacity:1}
.chk input:focus-visible+.box{outline:3px solid var(--blue);outline-offset:2px}
.chk .lbl{min-width:0}
.chk input:checked~.lbl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.chk.inline{border:0;min-height:44px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;gap:0;justify-items:center;padding:6px 0;min-height:60px;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2);cursor:pointer;position:relative}
.wd small{font-size:11px;font-weight:800;color:var(--ink-2)}
.wd b{font:700 22px/1.1 var(--hand)}
.wd.today b{color:var(--pink)}
.wd.sel{border-color:var(--outline);background:var(--hl)}
.wd.done::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);position:absolute;bottom:4px}
.datebar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.datebar .fld{flex:1 1 170px}

.note{display:grid;gap:6px;padding:14px 16px;border:2px dashed var(--pink);border-radius:var(--wob-s);background:var(--pink-soft)}
.note.g{border-color:var(--green);background:var(--green-soft)}
.note.b{border-color:var(--blue);background:var(--blue-soft)}
.refprev{min-height:24px;font-size:14px;display:grid;gap:4px}
.refprev a{font-weight:800}

/* contents (index) */
.index{position:relative;padding-left:58px}
.index::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--pink);opacity:.55}
.ix{position:relative;border-bottom:1.5px dashed var(--rule);padding-block:6px}
.pg{position:absolute;left:-58px;width:38px;top:8px;text-align:right;font:700 26px/1.1 var(--hand);color:var(--pink)}
.ix-main{display:grid;gap:0;width:100%;text-align:left;background:none;border:0;padding:6px 4px;cursor:pointer;min-height:48px;border-radius:var(--wob-s)}
.ix-main:hover{background:var(--paper-2)}
.ix-line{display:flex;align-items:baseline;gap:8px;min-width:0}
.ttl{font:700 20px/1.25 var(--hand);color:var(--ink);min-width:0;overflow-wrap:anywhere}
.leader{flex:1;min-width:12px;border-bottom:2px dotted var(--rule);transform:translateY(-4px)}
.ix time{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ix-ref{font-size:14px;color:var(--ink-2)}
.ix-detail{display:grid;gap:10px;padding:8px 4px 12px}
.dline h4{color:var(--blue);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.dline p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px)}
.seg{display:inline-flex;border:2px solid var(--rule);border-radius:var(--wob-s);padding:3px;gap:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:8px;background:none;font:800 14px var(--serif);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{height:12px;border-radius:999px;background:var(--rule);overflow:hidden;border:1.5px solid var(--outline)}
.bar>i{display:block;height:100%;width:var(--w,0%);background:var(--green)}
.empty{display:grid;gap:8px;justify-items:start;padding:8px 0}

/* tracker */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{display:grid;gap:0;padding:10px 14px;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2)}
.stat b{font:700 38px/1.1 var(--hand);color:var(--blue);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.patch{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pd{aspect-ratio:1;min-height:44px;display:grid;place-items:center;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2);position:relative;cursor:pointer;padding:0}
.pd svg{width:60%;height:60%;color:var(--green)}
.pd small{position:absolute;top:2px;left:5px;font-size:11px;font-weight:800;color:var(--ink-2)}
.pd.done{background:var(--green-soft);border-color:var(--green)}
.pd.miss svg{color:var(--ink-2);opacity:.28}
.pd.fut svg{opacity:0}
.pd.today{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.cd{aspect-ratio:1;min-height:40px;display:grid;place-items:center;border:2px solid transparent;border-radius:var(--wob-s);background:var(--paper-2);cursor:pointer;position:relative;padding:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cd.l1{background:color-mix(in srgb,var(--green) 14%,var(--paper))}
.cd.l2{background:color-mix(in srgb,var(--green) 30%,var(--paper))}
.cd.l3{background:color-mix(in srgb,var(--green) 48%,var(--paper))}
.cd.full{background:var(--green-soft)}
.cd.full svg{width:70%;height:70%;color:var(--green);position:absolute;opacity:.9}
.cd.full span{position:absolute;top:1px;left:4px;font-size:11px}
.cd.today{border-color:var(--pink)}
.cd .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pink)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.hb .bar{grid-column:1/-1;height:10px}
.hb b{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* bible */
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.bk{display:grid;gap:0;text-align:left;padding:8px 12px;min-height:52px;border:2px solid var(--rule);border-radius:var(--wob-s);cursor:pointer;
  background:linear-gradient(90deg,var(--hl) var(--p,0%),var(--paper-2) var(--p,0%))}
.bk b{font-size:15px}
.bk small{font-size:12px;font-weight:700;color:var(--ink-2)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.chb{min-height:46px;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2);font:800 15px var(--serif);cursor:pointer;font-variant-numeric:tabular-nums}
.chb.on{background:var(--green-soft);border-color:var(--green)}
.chb.sel{outline:3px solid var(--pink);outline-offset:1px}
.radios{display:grid;gap:4px}
.radios label{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.radios input{width:22px;height:22px;accent-color:var(--green);flex:none}

/* plan */
.steps{counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font:700 26px/1 var(--hand);color:var(--pink);text-align:center;border:2px solid var(--pink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;padding-top:2px}
.stage{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1.5px dashed var(--rule)}
.stage b.min{font:700 28px/1.1 var(--hand);color:var(--blue);font-variant-numeric:tabular-nums}
.stage b.min small{font:700 13px var(--serif);color:var(--ink-2)}
.timer{display:grid;gap:10px;padding:16px;border:2px solid var(--outline);border-radius:var(--wob-s);background:var(--paper-2)}
.timer .big{font:700 54px/1 var(--hand);color:var(--ink);font-variant-numeric:tabular-nums}
.quote{padding:12px 16px;border-left:5px solid var(--pink);background:var(--pink-soft);border-radius:0 var(--wob-s) var(--wob-s) 0;font-size:17px}
.formula{font:700 24px/1.35 var(--hand);padding:14px 16px;border:2px dashed var(--blue);border-radius:var(--wob-s);background:var(--blue-soft)}
.prompt{display:grid;gap:8px;padding:14px 16px;border:2px solid var(--rule);border-radius:var(--wob-s);background:var(--paper-2)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

.chip{display:inline-block;justify-self:start;font-size:12px;font-weight:800;padding:1px 10px;border-radius:999px;background:var(--blue-soft);color:var(--ink);border:1.5px solid var(--rule)}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ptext.open{display:block;overflow:visible}

/* cute + motion */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(12px,-26px) rotate(16deg)}}
@keyframes twinkle{0%,100%{opacity:1;scale:1}50%{opacity:.5;scale:.78}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes wiggle{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(-14deg)}95%{transform:rotate(11deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;width:var(--s,24px);height:var(--s,24px);opacity:.55;fill:currentColor;animation:drift var(--d,10s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.fl.c{color:var(--green)}.fl.s{color:#E9B84A}.fl.p{color:var(--pink)}.fl.b{color:var(--blue)}
.app{z-index:1}
.brand .logo{width:50px;height:50px;flex:none;display:inline-grid;animation:bob 3.2s ease-in-out infinite;-webkit-text-stroke:0}
.brand .logo svg,.brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:14px;color:inherit;-webkit-text-stroke:0}
.hbtns{display:flex;gap:8px}
.star{animation:twinkle 3s ease-in-out infinite}.star.b{animation-delay:.9s}.star.c{animation-delay:1.7s}
.sheet{animation:rise .5s ease both}
.btn{transition:transform .14s ease,background .14s}
.btn:hover{transform:translateY(-2px) rotate(-.6deg)}
.btn:active{transform:scale(.95)}
.chk:active .box{transform:scale(.85)}
.box{transition:transform .14s}
.nav button[aria-current="page"] svg{animation:wiggle 2.8s ease-in-out infinite}
.pd.done svg,.cd.full svg{animation:sway 3.4s ease-in-out infinite;transform-origin:50% 88%}
.toast{animation:tpop .3s ease both}
.dock{position:fixed;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;width:min(340px,calc(100vw - 24px));background:var(--paper);border:2px solid var(--outline);border-radius:var(--wob);padding:8px 10px 10px;display:grid;gap:6px;box-shadow:0 6px 0 rgba(75,59,61,.12)}
.dock iframe{width:100%;border:0;border-radius:12px;display:block}
.dock.min iframe{height:0!important}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 19px var(--hand);color:var(--blue)}
.dh .dbtns{display:flex;gap:6px}
.lgrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lgprev{width:64px;height:64px;display:grid}

var SKILL_TXT=["---","name: devotion","description: Formats biblical devotional notes using contextual criticism. Trigger when the user mentions devotion, Bible study notes, or analyzing a scripture passage for a sermon/devotional.","---","","# Devotion Analysis","","Analyze scripture passages or sermon texts using contextual criticism to create scannable, clear, and highly accessible devotional notes.","","## When to Use","","Use this skill whenever the user mentions “devotion”, asks for Bible study notes, or requests contextual analysis of a scripture passage or sermon text.","","## Structure & Layout","","Output all devotional analyses using the following format:","","* **Book / Sermon Title:** [Name of the book, passage, or sermon]","* **Author & Historical Context:** [Author/preacher background, target audience, historical setting, and literary context]","* **Key Verse:** [The central verse, quoted accurately]","* **Main Message:** [Core theological message summarized in 1–2 clear sentences]","* **Themes:** [3–4 central themes]","* **Interesting Insights:** [Notable historical, cultural, or textual details revealed via contextual criticism]","* **Word Bank & Etymology:** [1–3 key original Hebrew or Greek words with simple definitions and origins]","* **Personal Application:** [Concrete, practical takeaways for daily living]","","## Guidelines","","* **Tone & Language:** Maintain simple, accessible language that is easy to understand without sacrificing historical or theological accuracy.","* **Contextual Criticism:** Include specific cultural, historical, and literary background facts to illuminate the passage.","* **Brevity:** Keep sections concise, well-structured, and scannable.","","Passage or sermon text:",""].join('\n');
var DEFPROMPTS=[
{id:'p-skill',t:'Devotion analysis (full skill)',cat:'',text:SKILL_TXT},
{id:'p-short',t:'Short reading: quick notes',cat:'read-short',text:"Use the devotion format, but keep it very short. For this short passage give me: the key verse, the main message in 1–2 sentences, one interesting historical or cultural detail, one Hebrew or Greek word with a simple definition, and one concrete application for today. Use simple language.\n\nPassage:\n"},
{id:'p-long',t:'Long reading: overview',cat:'read-long',text:"Use the devotion format for this long reading (a chapter or more). Split it into sections with a one-line summary each, then give me the author and historical context, the key verse, 3–4 themes, the main message in 1–2 sentences, and one practical application. Keep it scannable.\n\nPassage:\n"},
{id:'p-pre',t:'Preaching: sermon notes',cat:'preaching',text:"Use the devotion format to analyze this sermon. Cover: sermon title and preacher background, the main scripture text and its context, the big idea in one sentence, the outline of points, the key verse, themes, and a personal application. Keep the language simple.\n\nSermon notes or transcript:\n"},
{id:'p-yt',t:'YouTube video: devotion notes',cat:'yt',text:"Turn this video into devotion notes. Give me: speaker and channel, the main passage, the main message in 1–2 sentences, 3 takeaways, one verse worth memorizing, and one way to apply it today.\n\nTranscript or notes:\n"},
{id:'p-letter',t:'Letter to God: starter prompts',cat:'letter',text:"Help me start a letter to God. Give me 5 gentle prompts: what I am thankful for, what is weighing on me, what I need, who I am praying for, and what I want to say to Him. Then suggest one verse that fits what I am going through.\n\nWhat is on my heart:\n"},
{id:'p-prayer',t:'Prayer: outline from a passage',cat:'prayer',text:"Give me a short prayer outline (Adoration, Confession, Thanksgiving, Supplication) based on this passage. Keep each part to 1–2 lines and use simple words.\n\nPassage:\n"}

function initDb(){

function streak(){
  var d=new Date();d.setHours(12);
  if(!dayDone(ymd(d)))d=addDays(d,-1);

function longest(){
  var a=doneKeys().map(dnum).sort(function(x,y){return x-y}),best=0,run=0,prev=null;

  return best;
}

function missedInfo(){
  var today=ymd(new Date());if(dayDone(today))return null;

  return gap>=2?{n:gap-1}:null;
}
function startInfo(){
  var s=state.settings.start;if(!s)return null;
  var n=dnum(ymd(new Date()))-dnum(s);
  if(n<0)return null;
  return {n:n,day:Math.min(n+1,30),over:n>=30,week:Math.min(3,Math.floor(Math.min(n,29)/7))};
}
function examples(){
  var t=new Date(),mk=function(n,page,ref,title,xr,f,iff,thn){return {id:'ex'+page,ex:true,date:ymd(addDays(t,-n)),page:page,title:title,ref:ref,cat:['read-short','preaching','prayer'][page-1],f:f}};
  return [
    mk(3,1,'Psalm 23','The Lord is my shepherd','Compare John 10:11, where Jesus calls himself the good shepherd.',['A shepherd feeds, guides and protects. David writes as someone who lived it.','I keep rehearsing what I lack. This psalm starts with what I already have.','Name three things I have been given this week before I open my email.'],'my mind starts listing what is missing','I will stop and thank God for one thing already given'),
    mk(2,2,'John 15:1-8','Staying connected','Isaiah 5 uses the vineyard picture too; Jesus is the true vine.',['Branches do not strain to produce fruit. They stay attached.','I try to bear fruit by effort and skip the staying part.','Sit for two quiet minutes before the day begins.'],'I feel pressure to prove myself at work','I will pause, pray one sentence and then carry on'),
    mk(1,3,'Philippians 4:4-9','Anxious for nothing','Verses 6 and 7 echo 1 Peter 5:7 about casting every worry on him.',['Paul writes from prison and still tells them to pray with thanks.','Worry and thanks cannot sit in the same sentence for long.','Pray about the one thing on my mind, with a thank-you included.'],'a worry comes back during the afternoon','I will pray about it right then, with one thing to thank him for')
  ];
}

/* ---------- Draft ---------- */
function newDraft(date){return {id:null,date:date,page:nextPage(),pageAuto:true,title:'',cat:'',ref:'',f:['','',''],mark:true}}
var draft=newDraft(ymd(new Date()));
var cur='log',openId=null,confirmId=null,sortBy='page',query='',catFilter='',pCat='',pOpen=null,pform={id:null,t:'',cat:'',text:''},sel=null,calM=(function(){var n=new Date();return {y:n.getFullYear(),m:n.getMonth()}})();
var VIEWS_LIST=['log','contents','prompts','plan','tracker','bible'];

/* ---------- Views ---------- */
function refPrev(){
  var d=draft,r=parseRef(d.ref);
  if(!d.ref.trim())return '<span class="muted">Type a passage such as John 3:16-18 or Psalm 23.</span>';
  if(!r)return '<span class="muted">That did not match a book yet. You can still save the entry.</span>';
  return '<a href="'+esc(bibleUrl(r))+'" target="_blank" rel="noopener">Open '+esc(refLabel(r))+' in '+esc(appName())+' ↗</a>'+
    '<label class="chk inline"><input type="checkbox" id="mark" data-d="mark"'+(d.mark?' checked':'')+'><span class="box" aria-hidden="true"></span><span class="lbl">Mark '+esc(r.book.name+' '+r.ch)+' as read in the Bible tab</span></label>';
}
function catName(id){var c=state.settings.cats.filter(function(x){return x.id===id})[0];return c?c.t:''}
function catOpts(sel,blank){return '<option value="">'+blank+'</option>'+state.settings.cats.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.t)+'</option>'}).join('')}
function viewLog(){

  }
  var si=startInfo(),mi=isToday?missedInfo():null,banner='';

  var jr=JOURNAL.map(function(f,i){return '<label class="fld"><span class="lab">'+f[0]+'</span><textarea id="f'+i+'" data-fi="'+i+'" rows="3" placeholder="'+esc(f[1])+'">'+esc(d.f[i]||'')+'</textarea></label>'}).join('');
  return ''+
  '<section class="sec"><header><p class="lab">'+(isToday?'Today':dt.getFullYear())+'</p><h2>'+esc(fmtLong(dt))+'</h2></header>'+
    '<div class="week" role="group" aria-label="This week">'+week+'</div>'+
    '<div class="datebar"><label class="fld"><span class="lab">Jump to a date</span><input type="date" id="dsel" data-d="date" value="'+esc(d.date)+'"></label>'+(isToday?'':'<button class="btn quiet" data-act="today">Back to today</button>')+'</div>'+
  '</section>'+banner+
  '<section class="sec"><header><h3>Today’s checklist</h3><p class="muted">Tick what you did. Any tick counts as a devotion day.</p></header><ul>'+checks+'</ul></section>'+
  '<section class="sec"><header><p class="lab">'+(d.id?'Editing page '+esc(d.page||''):'Notebook entry')+'</p><h3>What you wrote in your notebook</h3></header>'+
    '<div class="row2"><label class="fld"><span class="lab">Page</span><input type="number" inputmode="numeric" min="1" id="pg" data-d="page" value="'+esc(d.page)+'"></label>'+
    '<label class="fld"><span class="lab">Title</span><input type="text" id="ttl" data-d="title" value="'+esc(d.title)+'" placeholder="A few words, like in your contents page"></label></div>'+
    '<label class="fld"><span class="lab">Category</span><select id="cat" data-d="cat">'+catOpts(d.cat,'No category')+'</select></label>'+
    '<p class="muted">Need help analysing a passage? <button class="btn quiet sm" data-act="nav" data-v="prompts">Open prompt bank</button></p>'+
    '<label class="fld"><span class="lab">Passage</span><input type="text" id="ref" data-d="ref" value="'+esc(d.ref)+'" placeholder="John 15:1-8" autocomplete="off"></label>'+
    '<div class="refprev" id="refprev">'+refPrev()+'</div>'+
    jr+
  '</section>'+
  '<section class="sec"><header><h3>Save your entry</h3></header>'+
    '<div class="acts"><button class="btn primary" data-act="save">'+(d.id?'Update entry':'Save to Contents')+'</button>'+(d.id?'<button class="btn quiet" data-act="cancel">Cancel</button>':'<button class="btn quiet" data-act="clear">Clear form</button>')+'</div>'+
  '</section>';
}
function viewContents(){
  var real=state.entries.list,ex=!real.length&&state.settings.examples;
  var list=(ex?examples():real).slice(),q=query.trim().toLowerCase();
  if(catFilter)list=list.filter(function(e){return e.cat===catFilter});
  if(q)list=list.filter(function(e){return (e.title+' '+e.ref+' '+catName(e.cat)+' '+(e.f||[]).join(' ')).toLowerCase().indexOf(q)>=0});
  if(sortBy==='page')list.sort(function(a,b){var pa=a.page==null?1e9:a.page,pb=b.page==null?1e9:b.page;return pa-pb||a.date.localeCompare(b.date)});
  else list.sort(function(a,b){return b.date.localeCompare(a.date)});
  var rows=list.map(function(e){
    var open=openId===e.id,r=parseRef(e.ref),det='';
    if(open){
      var parts=[];
      JOURNAL.forEach(function(j,i){if(e.f&&e.f[i])parts.push([j[0],e.f[i]])});
      det='<div class="ix-detail">'+(parts.length?parts.map(function(p){return '<div class="dline"><h4>'+esc(p[0])+'</h4><p>'+esc(p[1])+'</p></div>'}).join(''):'<p class="muted">No notes were written for this entry.</p>')+
        '<div class="acts">'+(r?'<a class="btn quiet sm" href="'+esc(bibleUrl(r))+'" target="_blank" rel="noopener">Open passage ↗</a>':'')+
        (e.ex?'':'<button class="btn quiet sm" data-act="edit" data-id="'+esc(e.id)+'">Edit</button><button class="btn quiet sm danger" data-act="del" data-id="'+esc(e.id)+'">'+(confirmId===e.id?'Tap again to delete':'Delete')+'</button>')+'</div></div>';
    }
    return '<li class="ix"><span class="pg">'+(e.page==null?'–':esc(e.page))+'</span>'+
      '<button class="ix-main" data-act="toggle" data-id="'+esc(e.id)+'" aria-expanded="'+open+'"><span class="ix-line"><span class="ttl">'+esc(e.title||e.ref||'Untitled')+'</span><span class="leader"></span><time>'+esc(fmtShort(e.date))+'</time></span>'+(e.title&&e.ref?'<span class="ix-ref">'+esc(e.ref)+'</span>':'')+(e.cat&&catName(e.cat)?'<span class="chip">'+esc(catName(e.cat))+'</span>':'')+'</button>'+det+'</li>';
  }).join('');
  var body=list.length?'<ul class="index">'+rows+'</ul>':'<div class="empty"><p>'+((q||catFilter)?'Nothing matches that search.':'Your contents page is empty.')+'</p>'+((q||catFilter)?'':'<button class="btn primary" data-act="newentry">Add your first entry</button>')+'</div>';
  return '<section class="sec"><header><p class="lab">'+(ex?'Examples':real.length+(real.length===1?' entry':' entries'))+'</p><h2>Table of contents</h2></header>'+
    (ex?'<aside class="note"><p>These three rows are examples. Save your first entry and they disappear.</p></aside>':'')+
    '<div class="datebar"><label class="fld"><span class="lab">Search</span><input type="text" id="q" value="'+esc(query)+'" placeholder="Title, passage or notes" autocomplete="off"></label>'+
    '<label class="fld"><span class="lab">Category</span><select id="cf" data-cf="1">'+catOpts(catFilter,'All categories')+'</select></label>'+
    '<div class="seg" role="group" aria-label="Sort by"><button data-act="sort" data-v="page" aria-pressed="'+(sortBy==='page')+'">By page</button><button data-act="sort" data-v="date" aria-pressed="'+(sortBy==='date')+'">By date</button></div></div>'+
    '<div><button class="btn primary" data-act="newentry">New entry</button></div>'+body+'</section>';
}
function viewTracker(){
  var today=ymd(new Date()),hs=state.settings.habits,T=hs.length,si=startInfo(),s=state.settings.start;
  var mk=0,now=new Date(),pre=now.getFullYear()+'-'+pad(now.getMonth()+1);
  doneKeys().forEach(function(k){if(k.indexOf(pre)===0)mk++});
  var stats='<div class="stats"><div class="stat"><b>'+streak()+'</b><span>Day streak</span></div><div class="stat"><b>'+longest()+'</b><span>Longest streak</span></div><div class="stat"><b>'+mk+'</b><span>Days this month</span></div><div class="stat"><b>'+state.entries.list.length+'</b><span>Notebook entries</span></div></div>';
  var patch='';
  if(s&&dnum(today)-dnum(s)>=0){
    var cells='';for(var i=0;i<30;i++){
      var k=ymd(addDays(parse(s),i)),dn=dayDone(k),cls=dn?'done':(k<today?'miss':(k===today?'':'fut'));
      cells+='<button class="pd '+cls+(k===today?' today':'')+'" data-act="goday" data-d="'+k+'" aria-label="Day '+(i+1)+', '+esc(fmtLong(parse(k)))+(dn?', done':'')+'"><small>'+(i+1)+'</small>'+clover()+'</button>';
    }
    patch='<section class="sec"><header><p class="lab">'+(si&&!si.over?'Day '+si.day+' of 30':'30-day round finished')+'</p><h3>Your clover patch</h3><p class="muted">One clover grows for each day you show up. Missed days stay faint and need no catching up.</p></header><div class="patch">'+cells+'</div><div class="acts"><button class="btn quiet sm" data-act="startplan">Restart from today</button></div></section>';
  }else{
    patch='<section class="sec"><header><h3>Your clover patch</h3><p class="muted">Start a 30-day round and watch the patch fill in.</p></header><div class="acts"><button class="btn primary" data-act="startplan">Start my 30 days today</button></div></section>';
  }
  var y=calM.y,m=calM.m,first=new Date(y,m,1,12),lead=first.getDay(),dim=new Date(y,m+1,0).getDate(),entryDates={};
  state.entries.list.forEach(function(e){entryDates[e.date]=1});
  var cal=['S','M','T','W','T','F','S'].map(function(x){return '<span class="h" aria-hidden="true">'+x+'</span>'}).join('');
  for(var j=0;j<lead;j++)cal+='<span></span>';
  for(var dd=1;dd<=dim;dd++){
    var kk=y+'-'+pad(m+1)+'-'+pad(dd),c=dayCount(kk),lvl=c===0?0:(c>=T?4:Math.min(3,Math.ceil(3*c/T)));
    cal+='<button class="cd'+(lvl===4?' full':lvl?' l'+lvl:'')+(kk===today?' today':'')+'" data-act="goday" data-d="'+kk+'" aria-label="'+esc(fmtLong(parse(kk)))+', '+c+' of '+T+' done"><span>'+dd+'</span>'+(lvl===4?clover():'')+(entryDates[kk]?'<i class="dot"></i>':'')+'</button>';
  }
  var days30=[];for(var q=0;q<30;q++)days30.push(ymd(addDays(new Date(),-q)));
  var hb=hs.map(function(h){var c=days30.filter(function(k){return (state.days[k]||[]).indexOf(h.id)>=0}).length;
    return '<div class="hb"><span>'+esc(h.t)+'</span><b>'+c+'/30</b><div class="bar"><i style="--w:'+(c/30*100)+'%"></i></div></div>'}).join('');
  return '<section class="sec"><header><p class="lab">Progress</p><h2>Tracker</h2></header>'+stats+'<p class="muted">A day counts when you tick at least one checklist item or save an entry.</p></section>'+patch+
    '<section class="sec"><div class="calhead"><button class="btn quiet sm" data-act="calprev" aria-label="Previous month">←</button><h3>'+esc(first.toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'</h3><button class="btn quiet sm" data-act="calnext" aria-label="Next month">→</button></div><div class="cal">'+cal+'</div><p class="muted">A clover means every checklist item was ticked. A pink dot means you saved a notebook entry.</p></section>'+
    '<section class="sec"><header><h3>Last 30 days by habit</h3></header>'+hb+'</section>';
}
function viewBible(){
  var S=state.settings,b=byName[S.book]||byName.John,nx=nextUnread(b.name),rd=(state.read[b.name]||[]).length;
  var r={book:b,ch:nx||1,v1:null,v2:null},tr=0,ot=0,ota=0,nt=0,nta=0;
  books.forEach(function(x){var c=Math.min((state.read[x.name]||[]).length,x.n);tr+=c;if(x.ot){ot+=c;ota+=x.n}else{nt+=c;nta+=x.n}});
  var opt=books.map(function(x){return '<option value="'+esc(x.name)+'"'+(x.name===b.name?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');
  var grid=function(ot){return books.filter(function(x){return x.ot===ot}).map(function(x){var c=Math.min((state.read[x.name]||[]).length,x.n);return '<button class="bk" style="--p:'+(c/x.n*100)+'%" data-act="book" data-b="'+esc(x.name)+'"><b>'+esc(x.name)+'</b><small>'+c+' / '+x.n+'</small></button>'}).join('')};
  var vers=Object.keys(VERS).map(function(v){return '<option'+(S.version===v?' selected':'')+'>'+v+'</option>'}).join('');
  var app=function(v,l){return '<label><input type="radio" name="app" data-set="app" value="'+v+'"'+(S.app===v?' checked':'')+'>'+l+'</label>'};
  var cr=S.app==='custom'&&/^https?:\/\//i.test(S.template||'')?'':'';
  return '<section class="sec"><header><p class="lab">Scripture</p><h2>Bible</h2></header>'+
    '<div class="note g"><p class="lab">Continue reading</p><h3>'+(nx?esc(b.name+' '+nx):esc(b.name)+' finished')+'</h3><p class="muted">'+rd+' of '+b.n+' chapters read</p>'+
    '<div class="acts"><a class="btn primary" href="'+esc(bibleUrl(r))+'" target="_blank" rel="noopener">Open in '+esc(appName())+' ↗</a><button class="btn" data-act="usepassage" data-ref="'+esc(b.name+' '+(nx||1))+'">Use for today’s entry</button></div>'+
    '<label class="fld"><span class="lab">Reading focus</span><select id="bk" data-set="book">'+opt+'</select></label></div></section>'+
    '<section class="sec"><header><h3>Overall progress</h3><p class="muted">'+tr.toLocaleString()+' of '+TOTAL.toLocaleString()+' chapters</p></header>'+
    '<div class="bar"><i style="--w:'+(tr/TOTAL*100)+'%"></i></div>'+
    '<p class="muted">Old Testament '+ot+' / '+ota+' · New Testament '+nt+' / '+nta+'</p></section>'+
    '<section class="sec"><header><h3>Old Testament</h3></header><div class="bks">'+grid(true)+'</div></section>'+
    '<section class="sec"><header><h3>New Testament</h3></header><div class="bks">'+grid(false)+'</div></section>'+
    '<section class="sec"><header><h3>Open passages with</h3><p class="muted">Links open the chapter in your Bible app (YouVersion opens its app when installed) or on the website. Your reading progress is tracked here, not read from the app.</p></header>'+
    '<div class="radios" role="radiogroup" aria-label="Bible app">'+app('youversion','YouVersion')+app('biblegateway','Bible Gateway')+app('custom','Another Bible app or site')+'</div>'+
    (S.app==='custom'?'<label class="fld"><span class="lab">Link pattern</span><input type="text" id="tpl" data-set="template" value="'+esc(S.template)+'" placeholder="https://example.org/{code}/{chapter}" autocomplete="off"></label><p class="muted">Use {book}, {code} (like JHN), {chapter} and {verses} in a link from your app. It must start with https://.</p>':
      '<label class="fld"><span class="lab">Translation</span><select id="ver" data-set="version">'+vers+'</select></label>')+
    '</section>';
}
function viewPlan(){
  var S=state.settings,c=S.ctx,si=startInfo(),win=Math.max(5,Number(c.win)||20);
  var wins=[10,15,20,30,45,60].map(function(w){return '<option value="'+w+'"'+(win===w?' selected':'')+'>'+w+' minutes</option>'}).join('');
  var fmt=function(x){var v=Math.round(x*10)/10;return String(v)};
  var stages=STAGES.map(function(s){return '<div class="stage"><b class="min">'+fmt(win*s[1])+'<small> min</small></b><div><h4>'+s[0]+' · '+Math.round(s[1]*100)+'%</h4><p class="muted">'+s[2]+'</p></div></div>'}).join('');

  var fx=function(id,key,label,ph){return '<label class="fld"><span class="lab">'+label+'</span><input type="text" id="ctx-'+key+'" data-ctx="'+key+'" value="'+esc(c[key])+'" placeholder="'+esc(ph)+'"></label>'};
  var prompts=PROMPTS.map(function(p){return '<div class="prompt"><p>'+esc(p)+'</p><div class="acts"><button class="btn quiet sm" data-act="copy" data-text="'+esc(p)+'">Copy</button></div></div>'}).join('');

  '<section class="sec"><header><p class="lab">30-day devotional plan</p><h2>Plan</h2></header>'+

    (si&&!si.over?'<aside class="note b"><p class="lab">Day '+si.day+' of 30 · Week '+(si.week+1)+': '+esc(WEEKS[si.week][0])+'</p><p>'+esc(WEEKS[si.week][1])+'</p></aside>':
      '<div class="acts"><button class="btn primary" data-act="startplan">Start my 30 days today</button></div>')+
  '</section>'+
  '<section class="sec"><header><h3>Make it yours</h3><p class="muted">These answers shape the timings and reminders below.</p></header>'+
    '<label class="fld"><span class="lab">Time I can set aside</span><select id="ctx-win" data-ctx="win">'+wins+'</select></label>'+
    fx('w','when','When','6:30 AM before the house wakes up')+fx('p','place','Where','Corner chair by the window')+
    fx('f','friction','Biggest friction','Checking my phone, rushing to finish')+fx('s','focus','Scripture focus','Gospel of Mark, or Psalms on anxiety')+fx('o','outlet','Who I can share with','Small group, spouse, a friend by text')+
  '</section>'+
  '<section class="sec"><header><p class="lab">Under 2 minutes</p><h3>Entry ritual</h3></header>'+
    '<ol class="steps"><li><p>Put your phone in airplane mode and set it face down out of reach, or leave it in another room.</p></li><li><p>Sit in the same spot every time. Set the Bible, notebook and pen where your hands will land.</p></li><li><p>Add one sensory cue: a warm drink, a candle or a soft light.</p></li><li><p>Sit upright, feet flat, hands open on your lap. Take three slow breaths.</p></li><li><p>Pray the opening prayer below before you read a word.</p></li></ol>'+
    (c.friction?'<aside class="note"><p class="lab">Your friction</p><p>'+esc(c.friction)+'. Remove it before you sit down, not while you are sitting.</p></aside>':'')+
    (c.place||c.when?'<p class="muted">Your spot: '+esc([c.when,c.place].filter(Boolean).join(' · '))+'</p>':'')+
    '<blockquote class="quote" style="margin:0">Lord, quiet my mind and open my heart to what you want to say today. Give me eyes to see what is true in this passage and the courage to do what it asks.</blockquote>'+
  '</section>'+
  '<section class="sec"><header><p class="lab">'+win+'-minute session</p><h3>Four-stage session flow</h3></header>'+stages+
    '<div class="timer"><p class="lab" id="tm-stage"></p><p class="big" id="tm-time">00:00</p><div class="bar"><i id="tm-bar"></i></div><p class="muted" id="tm-hint"></p>'+
    '<div class="acts"><button class="btn primary" id="tm-go" data-act="tmgo">Start</button><button class="btn quiet" data-act="tmskip">Next stage</button><button class="btn quiet" data-act="tmreset">Reset</button></div></div>'+
  '</section>'+

    img.onload=function(){

      c.getContext('2d').drawImage(img,0,0,c.width,c.height);

/* ---------- Timer ---------- */
var tm={run:false,i:0,left:0,iv:null,lock:null,done:false};
function stageSecs(i){return Math.round(Math.max(5,Number(state.settings.ctx.win)||20)*60*STAGES[i][1])}
function tmReset(){tm.run=false;tm.i=0;tm.done=false;tm.left=stageSecs(0);clearInterval(tm.iv);tmRelease();tmPaint()}
function tmRelease(){try{if(tm.lock){tm.lock.release();tm.lock=null}}catch(e){}}
function tmPaint(){
  var t=$('#tm-time');if(!t)return;
  var m=Math.floor(tm.left/60),s=tm.left%60;
  t.textContent=pad(m)+':'+pad(s);
  $('#tm-stage').textContent=tm.done?'Finished':'Stage '+(tm.i+1)+' of 4 · '+STAGES[tm.i][0];
  $('#tm-hint').textContent=tm.done?'Log what you wrote while it is fresh.':STAGES[tm.i][2];
  $('#tm-bar').style.width=(tm.done?100:(1-tm.left/stageSecs(tm.i))*100)+'%';
  $('#tm-go').textContent=tm.run?'Pause':(tm.done?'Start again':'Start');
}
function tmTick(){
  if(!tm.run)return;
  tm.left--;
  if(tm.left<=0){
    if(tm.i<STAGES.length-1){tm.i++;tm.left=stageSecs(tm.i);toast('Next: '+STAGES[tm.i][0])}
    else{tm.run=false;tm.done=true;tm.left=0;clearInterval(tm.iv);tmRelease();toast('Session finished.')}
  }
  tmPaint();
}
function tmGo(){
  if(tm.done){tmReset()}
  tm.run=!tm.run;clearInterval(tm.iv);
  if(tm.run){
    tm.iv=setInterval(tmTick,1000);
    try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){tm.lock=l}).catch(function(){})}catch(e){}
  }else tmRelease();
  tmPaint();
}
function tmSkip(){if(tm.i<STAGES.length-1){tm.i++;tm.left=stageSecs(tm.i)}else{tm.left=0;tm.run=false;tm.done=true;clearInterval(tm.iv);tmRelease()}tmPaint()}

  var ids=hset(),day={};(state.days[e.date]||[]).forEach(function(x){day[x]=1});
  if(ids.read&&e.ref)day.read=1;

    case 'cancel':draft=newDraft(draft.date);render();break;
    case 'newentry':draft=newDraft(ymd(new Date()));go('log');break;
    case 'toggle':openId=openId===ds.id?null:ds.id;confirmId=null;render();break;
    case 'edit':{
      var e=state.entries.list.filter(function(x){return x.id===ds.id})[0];if(!e)break;
      draft={id:e.id,date:e.date,page:e.page==null?'':e.page,pageAuto:false,title:e.title||'',cat:e.cat||'',ref:e.ref||'',f:[(e.f||[])[0]||'',(e.f||[])[1]||'',(e.f||[])[2]||''],mark:false};
      go('log');break;}
    case 'del':
      if(confirmId===ds.id){state.entries.list=state.entries.list.filter(function(x){return x.id!==ds.id});save('entries');confirmId=null;openId=null;toast('Entry deleted.');render()}
      else{confirmId=ds.id;render()}
      break;
    case 'sort':sortBy=ds.v;render();break;
    case 'calprev':calM.m--;if(calM.m<0){calM.m=11;calM.y--}render();break;
    case 'calnext':calM.m++;if(calM.m>11){calM.m=0;calM.y++}render();break;
    case 'goday':if(draft.id)draft=newDraft(ds.d);else draft.date=ds.d;go('log');break;
    case 'startplan':state.settings.start=ymd(new Date());save('settings');toast('Your 30 days start today.');render();break;
    case 'book':sel={book:ds.b,ch:null};renderSheet();var x=$('#sh-x');if(x)x.focus();break;
    case 'closesheet':sel=null;renderSheet();break;
    case 'chap':{
      var b=byName[sel.book],n=+ds.n,set={};(state.read[b.name]||[]).forEach(function(v){set[v]=1});
      if(set[n])delete set[n];else set[n]=1;
      var arr=Object.keys(set).map(Number).sort(function(a,c){return a-c});
      if(arr.length)state.read[b.name]=arr;else delete state.read[b.name];
      sel.ch=n;save('read');render();break;}
    case 'markall':{var bb=byName[sel.book],all=[];for(var i=1;i<=bb.n;i++)all.push(i);state.read[bb.name]=all;save('read');render();break;}
    case 'clearbook':delete state.read[sel.book];save('read');render();break;
    case 'usepassage':draft.ref=ds.ref;go('log');break;
    case 'rmh':
      if(state.settings.habits.length<=1){toast('Keep at least one item.');break}
      state.settings.habits=state.settings.habits.filter(function(h){return h.id!==ds.id});save('settings');render();break;
    case 'addh':addHabit();break;
    case 'copy':
      try{navigator.clipboard.writeText(ds.text).then(function(){toast('Copied.')},function(){toast('Press and hold the text to copy it.')})}catch(e){toast('Press and hold the text to copy it.')}
      break;
    case 'opensettings':setOpen=true;confirmId=null;renderSettings();break;
    case 'closeset':setOpen=false;confirmId=null;renderSettings();break;
    case 'music':
      if(!state.settings.music){setOpen=true;renderSettings();var mi=$('#mu');if(mi)mi.focus()}
      else{dockOpen=!dockOpen;paintDock()}
      break;
    case 'mplay':{
      var inp=$('#mu'),u=inp?inp.value.trim():'';
      if(!parseMusic(u)){toast('That does not look like a YouTube or Spotify link.');break}
      state.settings.music=u;save('settings');dockOpen=true;dockMin=false;dockKey='';paintDock();renderSettings();toast('Music is ready. Press play in the player.');break;}
    case 'mstop':state.settings.music='';save('settings');dockOpen=false;dockKey='';paintDock();renderSettings();break;
    case 'dockmin':dockMin=!dockMin;$('#dock').classList.toggle('min',dockMin);{var b0=$('#dk-min');if(b0)b0.textContent=dockMin?'Show':'Hide'}break;
    case 'dockclose':dockOpen=false;paintDock();break;
    case 'logoreset':state.settings.logo='';save('settings');paintLogo();renderSettings();break;
    case 'dlbackup':
      try{var bl=new Blob([backupJson()],{type:'application/json'}),an=document.createElement('a');an.href=URL.createObjectURL(bl);an.download='devotion-notebook-backup.json';document.body.appendChild(an);an.click();an.remove();toast('Backup downloaded.')}
      catch(er2){toast('Downloads are blocked here. Use Copy backup instead.')}
      break;
    case 'copybackup':
      try{navigator.clipboard.writeText(backupJson()).then(function(){toast('Backup copied. Paste it somewhere safe.')},function(){toast('Could not copy. Try Download backup.')})}catch(er3){toast('Could not copy. Try Download backup.')}
      break;
    case 'restore':{
      var ta=$('#bkt'),txt=ta?ta.value:bkText,o2=null;
      try{o2=JSON.parse(txt)}catch(er4){}
      if(!o2||o2.app!=='devotion-notebook'){toast('That does not look like a Devotion Notebook backup.');confirmId=null;renderSettings();break}
      if(confirmId!=='restore'){confirmId='restore';renderSettings();break}
      state.settings=mergeSettings(o2.settings);state.days=o2.days||{};state.read=o2.read||{};
      state.entries=(o2.entries&&Array.isArray(o2.entries.list))?o2.entries:{list:[]};
      KEYS.forEach(save);confirmId=null;bkText='';logoKey=null;tmReset();render();renderSettings();paintDock();toast('Backup restored.');break;}
    case 'fbsignin':fbSignIn();break;
    case 'fbsignout':if(fb.auth)fb.auth.signOut();break;
    case 'fbsave':{
      var ta2=$('#fbc'),cfg2=parseCfg(ta2?ta2.value:fbText);
      if(!cfg2){toast('I could not find apiKey, authDomain, projectId and appId in that.');break}
      try{localStorage.setItem('dn-fbconfig',JSON.stringify(cfg2))}catch(er5){toast('This browser would not save the settings.');break}
      toast('Saved. Reloading…');setTimeout(function(){location.reload()},600);break;}
    case 'fbclear':try{localStorage.removeItem('dn-fbconfig')}catch(er6){}location.reload();break;
    case 'ptoggle':pOpen=pOpen===ds.id?null:ds.id;render();break;
    case 'copyp':{
      var pp=state.settings.prompts.filter(function(x){return x.id===ds.id})[0];if(!pp)break;
      try{navigator.clipboard.writeText(pp.text).then(function(){toast('Prompt copied.')},function(){toast('Open the prompt and press and hold the text to copy it.')})}catch(er){toast('Open the prompt and press and hold the text to copy it.')}
      break;}
    case 'pedit':{
      var p2=state.settings.prompts.filter(function(x){return x.id===ds.id})[0];if(!p2)break;
      pform={id:p2.id,t:p2.t,cat:p2.cat||'',text:p2.text};render();var pfe=$('#pform');if(pfe)pfe.scrollIntoView();break;}
    case 'pdel':
      if(confirmId===ds.id){state.settings.prompts=state.settings.prompts.filter(function(x){return x.id!==ds.id});if(pform.id===ds.id)pform={id:null,t:'',cat:'',text:''};save('settings');confirmId=null;toast('Prompt deleted.');render()}
      else{confirmId=ds.id;render()}
      break;
    case 'psave':{
      if(!pform.t.trim()||!pform.text.trim()){toast('Add a name and the prompt text.');break}
      var rec={id:pform.id||('p'+uid()),t:pform.t.trim(),cat:pform.cat||'',text:pform.text},PL=state.settings.prompts,pi=PL.map(function(x){return x.id}).indexOf(rec.id);
      if(pi>=0)PL[pi]=rec;else PL.push(rec);
      save('settings');pform={id:null,t:'',cat:'',text:''};toast('Prompt saved.');render();break;}
    case 'pcancel':pform={id:null,t:'',cat:'',text:''};render();break;
    case 'addc':{
      var ci=$('#newc'),cv=ci?ci.value.trim():'';
      if(!cv){toast('Type a name for the category.');break}
      state.settings.cats.push({id:'c'+uid(),t:cv});save('settings');render();break;}
    case 'rmc':
      state.settings.cats=state.settings.cats.filter(function(c){return c.id!==ds.id});
      if(catFilter===ds.id)catFilter='';if(pCat===ds.id)pCat='';if(draft.cat===ds.id)draft.cat='';
      save('settings');render();break;
    case 'tmgo':tmGo();break;
    case 'tmskip':tmSkip();break;
    case 'tmreset':tmReset();break;
  }
}
function addHabit(){
  var inp=$('#newh'),v=inp?inp.value.trim():'';
  if(!v){toast('Type a name for the new item.');return}
  state.settings.habits.push({id:'h'+uid(),t:v});save('settings');render();
}

/* ---------- Events ---------- */
var viewEl=$('#view'),ovEl=$('#ov');
function onClick(e){
  if(e.target===ovEl){sel=null;renderSheet();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  act(t.dataset.act,t);
}
viewEl.addEventListener('click',onClick);
var ov2El=$('#ov2');
$('.top').addEventListener('click',onClick);
ov2El.addEventListener('click',function(e){
  if(e.target===ov2El){setOpen=false;renderSettings();return}
  var t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t);
});
$('#dock').addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t)});
ov2El.addEventListener('input',function(e){var t=e.target;if(t.dataset.mu)musicDraft=t.value;else if(t.dataset.bk)bkText=t.value;else if(t.dataset.fbc)fbText=t.value});
ov2El.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.logo){logoFile(t.files&&t.files[0]);t.value=''}
  else if(t.dataset.bkfile){var f=t.files&&t.files[0];if(f){var r=new FileReader();r.onload=function(){bkText=String(r.result);var ta=$('#bkt');if(ta)ta.value=bkText};r.readAsText(f)}t.value=''}
  else if(t.dataset.an){state.settings.anim=t.checked;save('settings');applyAnim()}
});
ovEl.addEventListener('click',onClick);
$('#nav').addEventListener('click',onClick);
viewEl.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.d){
    var k=t.dataset.d;
    if(k==='page'){draft.page=t.value;draft.pageAuto=false}
    else if(k==='title'||k==='xr'||k==='iff'||k==='thn')draft[k]=t.value;
    else if(k==='ref'){draft.ref=t.value;$('#refprev').innerHTML=refPrev()}
  }else if(t.dataset.fi!==undefined)draft.f[+t.dataset.fi]=t.value;
  else if(t.dataset.pf)pform[t.dataset.pf]=t.value;
  else if(t.id==='q'){query=t.value;render()}
});
viewEl.addEventListener('change',function(e){
  var t=e.target,ds=t.dataset;
  if(ds.habit)toggleHabit(draft.date,ds.habit);
  else if(ds.d==='date'){if(t.value){draft.date=t.value;render()}}
  else if(ds.d==='mark')draft.mark=t.checked;
  else if(ds.d==='cat')draft.cat=t.value;
  else if(ds.cf!==undefined){catFilter=t.value;render()}
  else if(ds.pc!==undefined){pCat=t.value;render()}
  else if(ds.pf!==undefined)pform[ds.pf]=t.value;
  else if(ds.cid){var cc=state.settings.cats.filter(function(x){return x.id===ds.cid})[0];if(cc&&t.value.trim()){cc.t=t.value.trim();save('settings')}else if(cc)t.value=cc.t}
  else if(ds.ctx){
    var v=ds.ctx==='win'?Number(t.value):t.value.trim();
    state.settings.ctx[ds.ctx]=v;save('settings');
    if(ds.ctx==='win'){tmReset();render()}
  }
  else if(ds.hid){
    var h=state.settings.habits.filter(function(x){return x.id===ds.hid})[0];
    if(h&&t.value.trim()){h.t=t.value.trim();save('settings')}else if(h){t.value=h.t}
  }
  else if(ds.set){
    var key=ds.set,val=t.value;
    if(key==='template'){val=val.trim();if(val&&!/^https?:\/\//i.test(val)){toast('The link must start with https://');t.value=state.settings.template;return}}
    setSetting(key,val);
  }
});
viewEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newh'){e.preventDefault();addHabit()}});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(setOpen){setOpen=false;renderSettings()}else if(sel){sel=null;renderSheet()}});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS_LIST.indexOf(v)>=0&&v!==cur){cur=v;render();window.scrollTo(0,0)}});

/* ---------- Start ---------- */
try{var h0=location.hash.slice(1);if(VIEWS_LIST.indexOf(h0)>=0)cur=h0}catch(e){}
tmReset();
setSync('local');
render();
initSync();
})();
</script>
